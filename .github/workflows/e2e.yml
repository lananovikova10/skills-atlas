# The web view in Chromium, compared to its screenshots to the pixel: in the Playwright image of the
# version in package.json, the one the baselines are made in (update-baselines.yml).
# Pushes to main and pull requests only, so a push to a pull request's branch runs it once.
name: e2e
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run e2e
        env:
          HOME: /root
      # Every run is recorded: the videos, and the report with the expected, actual and diff images.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

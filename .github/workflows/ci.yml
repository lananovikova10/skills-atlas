# CI for your Skill Atlas repository: the typecheck, the tests and the CLI itself, on every push
# and pull request, on a clean machine. A pull request is ready when this is green.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The real CLI on real repositories, each at a pinned commit; the token raises GitHub's rate limit.
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The real CLI on the fixture repository, as a user would run it: it must exit 0.
      - name: Smoke test
        run: |
          ./skill-atlas help
          ./skill-atlas scan ./fixture
      # The web view, as a user would open it: the page and the scan of the fixture.
      - name: Web view smoke test
        run: |
          ./skill-atlas serve --port 4173 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:4173/ > /dev/null && break; sleep 0.5; done
          curl -fs http://127.0.0.1:4173/ | grep -q 'data-view="graph"'
          curl -fs "http://127.0.0.1:4173/api/scan?repo=./fixture" | grep -q '"name":"commits"'
          kill %1
      # The demo in docs/demo as a test in Chromium, with its screenshots, is e2e.yml: in the Playwright image.

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skill Atlas</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="app-bar">
      <h1 class="app-title">Skill Atlas</h1>
      <div class="segmented" role="tablist" aria-label="View">
        <button role="tab" data-view="list" aria-selected="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v2H3zm0 6h18v2H3zm0 6h18v2H3z" /></svg>List
        </button>
        <button role="tab" data-view="graph" aria-selected="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17 14a3 3 0 0 0-2.4 1.2l-5.3-2.6a3 3 0 0 0 0-1.2l5.3-2.6A3 3 0 1 0 14 7c0 .2 0 .4.1.6L8.8 10.2a3 3 0 1 0 0 3.6l5.3 2.6A3 3 0 1 0 17 14z" />
          </svg>Graph
        </button>
      </div>
    </header>

    <main>
      <form class="repo-form card" id="repo-form">
        <label class="text-field">
          <span class="text-field-label">Repository</span>
          <input id="repo" name="repo" type="text" autocomplete="off" spellcheck="false" required
            placeholder="https://github.com/owner/repo, …/tree/&lt;commit&gt;, or a local directory" />
        </label>
        <button class="button filled" type="submit" id="analyse">Analyse</button>
      </form>
      <div class="progress" id="progress" hidden><div></div></div>
      <div class="banner error" id="error" role="alert" hidden></div>

      <section id="result" hidden>
        <div class="summary">
          <a id="repo-link" target="_blank" rel="noopener"></a>
          <span id="summary-text" aria-live="polite"></span>
          <button class="button text" id="show-notes" type="button" hidden></button>
        </div>
        <div class="banner notes" id="notes" hidden></div>

        <div class="layout">
          <aside class="filters card" aria-label="Filters">
            <div class="text-field dense search-field">
              <label class="text-field-label" for="search">Search</label>
              <input id="search" type="search" placeholder="Name or description · press /" autocomplete="off" spellcheck="false" />
              <button class="icon-button" id="search-clear" type="button" aria-label="Clear search" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z" /></svg>
              </button>
            </div>
            <div id="facets"></div>
            <button class="button text" type="button" id="clear-filters">Clear filters</button>
          </aside>

          <div class="content">
            <div id="list-view" class="skill-grid"></div>
            <div id="graph-view" hidden>
              <div class="graph-toolbar">
                <label class="switch"><input type="checkbox" id="graph-tools" /><span></span>Allowed tools</label>
                <label class="switch"><input type="checkbox" id="graph-keys" /><span></span>Front matter keys</label>
                <button class="button text" type="button" id="graph-fit">Fit</button>
              </div>
              <div id="graph" class="card"></div>
              <div class="graph-legend" id="graph-legend"></div>
            </div>
            <div class="empty" id="empty" hidden>
              <p id="empty-text">No skills match these filters.</p>
              <button class="button text" type="button" id="empty-clear" hidden>Clear search</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div class="scrim" id="scrim" hidden></div>
    <aside class="sheet" id="sheet" aria-hidden="true" aria-labelledby="sheet-title">
      <header>
        <h2 id="sheet-title"></h2>
        <button class="icon-button" id="sheet-close" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12z" /></svg>
        </button>
      </header>
      <div id="sheet-body"></div>
    </aside>

    <script type="module" src="/app.js"></script>
  </body>
</html>
